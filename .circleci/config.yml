version: 2.1

references:
  default_docker_ruby_executor: &default_docker_ruby_executor
    image: cimg/ruby:2.7.7
    environment:
      BUNDLE_PATH: vendor/bundle
      RAILS_ENV: test
      COVERAGE: true
      TZ: /usr/share/zoneinfo/America/Chicago

jobs:
  build:
    working_directory: ~/active_force/active_force_index
    docker:
      - *default_docker_ruby_executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - active_force-{{ checksum "active_force.gemspec" }}
            - active_force-
      - run:
          name: Bundle Install
          command: |
            gem install bundler
            bundle check || bundle install
      - save_cache:
          key: active_force-{{ checksum "active_force.gemspec" }}
          paths:
            - ~/active_force/active_force_index/vendor/bundle

  rspec-test:
    working_directory: ~/active_force/active_force_index
    parallelism: 1
    docker:
      - *default_docker_ruby_executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - active_force-{{ checksum "active_force.gemspec" }}
            - active_force-
      - run:
          name: Bundle Install
          command: |
            gem install bundler
            bundle check || bundle install
      - save_cache:
          key: active_force-{{ checksum "active_force.gemspec" }}
          paths:
            - ~/active_force/active_force_index/vendor/bundle
      - run:
          name: Run RSpec
          command: |
            mkdir /tmp/test-results
            TESTFILES=$(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)
            bundle exec rspec $TESTFILES --profile 10 --format RspecJunitFormatter --out /tmp/test-results/rspec.xml --format progress
      - store_artifacts:
          path: coverage

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
      - rspec-test:
          requires:
            - build
